<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#edf4f8">
  <title>CK65 Warehouse Entry</title>
  <link href="https://www.copeland.com/49ea62/contentassets/e08202be2dff44d1bcda93f0dae74605/favicon.ico" rel="icon"
    type="image/x-icon">
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%
    }

    body {
      background: #edf4f8;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: #111827;
      padding: 6px
    }

    .card {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .13);
      padding: 16px
    }

    .hidden {
      display: none !important
    }

    .userbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding: 9px 11px;
      border-radius: 9px;
      background: #f1f5f9;
      font-size: 13px
    }

    .userbar strong {
      display: block;
      max-width: 305px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .logout {
      height: 34px;
      padding: 0 12px;
      background: #64748b;
      color: #fff
    }

    .field {
      margin-bottom: 13px
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 700
    }

    .req {
      color: #c50f1f
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 8px 12px;
      font: inherit;
      font-size: 16px;
      outline: none;
      background: #fff
    }

    input:focus {
      border-color: #107c10;
      box-shadow: 0 0 0 3px rgba(16, 124, 16, .13)
    }

    input.bad {
      border-color: #c50f1f;
      background: #fff7f7
    }

    input.valid {
      border-color: #107c10;
      background: #f0fdf4
    }

    .err {
      display: none;
      margin-top: 4px;
      color: #c50f1f;
      font-size: 12px
    }

    .status,
    .msg {
      display: none;
      padding: 9px 11px;
      border-radius: 9px;
      margin-bottom: 12px;
      font-size: 13px
    }

    .ok {
      display: block;
      background: #dcfce7;
      color: #166534
    }

    .fail {
      display: block;
      background: #fee2e2;
      color: #991b1b
    }

    .checking {
      display: block;
      background: #e0f2fe;
      color: #075985
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    button {
      height: 48px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 700;
      cursor: pointer
    }

    .clear {
      background: #e5ebf1;
      color: #111827
    }

    .primary {
      background: #107c10;
      color: #fff
    }

    .login-btn {
      width: 100%;
      background: #107c10;
      color: #fff
    }

    .password-wrap {
      position: relative
    }

    .password-wrap input {
      padding-right: 72px
    }

    .showpass {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 62px;
      height: 38px;
      background: #e5ebf1;
      font-size: 12px
    }

    button:disabled {
      opacity: .6;
      cursor: wait
    }

    .login-title {
      font-size: 20px;
      font-weight: 750;
      text-align: center;
      margin: 3px 0 16px
    }

    .login-note {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      margin-top: 10px
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      margin-right: 6px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      vertical-align: -2px;
      animation: spin .7s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }


    .app-label {
      display: block;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: #334155
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 15px
    }

    .app-card {
      position: relative;
      height: 86px;
      padding: 8px 5px;
      border: 1px solid #d8e2dc;
      border-radius: 12px;
      background: #f8fbf9;
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: none;
      transition: .15s ease
    }

    .app-card:hover {
      border-color: #72b98e;
      background: #f2fbf5
    }

    .app-card.selected {
      border: 2px solid #107c10;
      background: #eaf8ee;
      color: #0f5132;
      box-shadow: 0 0 0 3px rgba(16, 124, 16, .10)
    }

    .app-icon {
      position: relative;
      width: 48px;
      height: 40px;
      display: block
    }

    .app-icon svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .app-name {
      font-size: 11px;
      font-weight: 800;
      line-height: 1.15;
      white-space: normal;
      text-align: center
    }

    .app-check {
      display: none;
      position: absolute;
      right: 6px;
      top: 5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #107c10;
      color: #fff;
      font-size: 12px;
      line-height: 18px;
      text-align: center
    }

    .app-card.selected .app-check {
      display: block
    }

    .app-error {
      display: none;
      margin: -8px 0 11px;
      color: #c50f1f;
      font-size: 12px
    }

    /* Modern login screen */
    #loginPanel {
      position: relative;
      margin: -16px;
      padding: 28px 20px 22px;
      min-height: calc(100vh - 12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
      background: linear-gradient(145deg, #f1fff5 0%, #ffffff 48%, #e7f4ec 100%)
    }

    #loginPanel::before,
    #loginPanel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none
    }

    #loginPanel::before {
      width: 230px;
      height: 230px;
      right: -115px;
      top: -105px;
      background: rgba(0, 132, 61, .10)
    }

    #loginPanel::after {
      width: 170px;
      height: 170px;
      left: -100px;
      bottom: -80px;
      background: rgba(0, 132, 61, .08)
    }

    .login-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      padding: 26px 20px 22px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(16, 124, 16, .13);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, .14)
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 14px
    }

    .logo-wrap {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin-bottom: 12px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid #dce9df;
      box-shadow: 0 9px 22px rgba(0, 100, 45, .14)
    }

    .company-logo {
      width: 48px;
      height: 48px;
      object-fit: contain
    }

    .system-name {
      margin: 0;
      color: #0f5132;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin: 5px 0 4px;
      color: #111827
    }

    .login-subtitle {
      margin: 0;
      color: #64748b;
      font-size: 13px
    }

    #loginPanel label {
      font-size: 13px;
      color: #334155
    }

    #loginPanel input {
      height: 52px;
      border-radius: 11px;
      background: #f8fafc;
      border-color: #d5dee8;
      padding-left: 42px
    }

    #loginPanel input:focus {
      background: #fff
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      color: #64748b;
      pointer-events: none
    }

    .input-wrap {
      position: relative
    }

    .password-wrap input {
      padding-right: 58px
    }

    .showpass {
      right: 7px;
      top: 7px;
      width: 42px;
      height: 38px;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1;
      background: #e8f2eb;
      color: #166534
    }

    .login-btn {
      height: 52px;
      margin-top: 3px;
      border-radius: 11px;
      background: linear-gradient(135deg, #107c10, #006b3c);
      box-shadow: 0 8px 18px rgba(16, 124, 16, .24);
      transition: transform .15s ease, box-shadow .15s ease
    }

    .login-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(16, 124, 16, .20)
    }

    .login-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 15px;
      color: #64748b
    }

    @media(max-width:520px) {
      .app-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px
      }

      .app-card {
        height: 82px;
        padding: 7px 3px
      }

      .app-icon {
        width: 44px;
        height: 37px
      }

      .app-name {
        font-size: 10px
      }

      body {
        padding: 0;
        background: #eef7f1
      }

      .card {
        max-width: none;
        min-height: 100vh;
        border-radius: 0;
        padding: 16px;
        box-shadow: none
      }

      #loginPanel {
        min-height: calc(100vh - 32px);
        border-radius: 14px;
        padding: 20px 10px
      }

      .login-shell {
        padding: 24px 18px 20px
      }
    }

    /* DHL Material Inspection */
    #dhlPanel {
      padding: 0
    }

    .dhl-hero {
      margin: -16px -16px 14px;
      padding: 16px;
      background: linear-gradient(135deg, #FFCC00, #ffe680);
      border-bottom: 4px solid #D40511
    }

    .dhl-hero h2 {
      margin: 0;
      color: #D40511;
      font-size: 20px
    }

    .dhl-hero p {
      margin: 3px 0 0;
      color: #713f12;
      font-size: 12px
    }

    .dhl-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 13px;
      padding: 9px 11px;
      border-radius: 9px;
      background: #f1f5f9;
      font-size: 12px
    }

    .dhl-user {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .dhl-field {
      margin-bottom: 13px
    }

    .dhl-field textarea {
      width: 100%;
      min-height: 76px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
      resize: vertical
    }

    .dhl-field input {
      height: 48px
    }

    .dhl-filebox {
      padding: 11px;
      border: 1px dashed #d4a90a;
      border-radius: 9px;
      background: #fffbeb
    }

    .dhl-files {
      list-style: none;
      padding: 0;
      margin: 8px 0 0
    }

    .dhl-files li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      padding: 7px 9px;
      border-radius: 7px;
      background: #fff;
      font-size: 12px
    }

    .dhl-remove {
      height: auto;
      padding: 3px 7px;
      background: #fee2e2;
      color: #991b1b
    }

    .dhl-actions {
      display: grid;
      grid-template-columns: 1.15fr .8fr 1.2fr;
      gap: 7px
    }

    .dhl-actions button {
      height: 46px;
      font-size: 12px
    }

    .dhl-latest {
      background: #FFCC00;
      color: #713f12
    }

    .dhl-submit {
      background: #D40511;
      color: #fff
    }

    .dhl-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      padding: 16px;
      background: #0f172a8c;
      align-items: center;
      justify-content: center
    }

    .dhl-modal.show {
      display: flex
    }

    .dhl-modalbox {
      width: min(100%, 520px);
      max-height: 88vh;
      overflow: hidden;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 22px 55px #0005
    }

    .dhl-modalhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #FFCC00;
      color: #D40511
    }

    .dhl-close {
      width: 38px;
      height: 34px;
      background: #64748b;
      color: #fff
    }

    .dhl-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
      padding: 12px
    }

    .dhl-search input {
      height: 42px
    }

    .dhl-search button {
      height: 42px;
      padding: 0 12px;
      background: #107c10;
      color: #fff
    }

    .dhl-showlatest {
      grid-column: 1/-1;
      background: #FFCC00 !important;
      color: #713f12 !important
    }

    .dhl-results {
      max-height: 58vh;
      overflow: auto;
      padding: 0 12px 12px
    }

    .dhl-row {
      padding: 10px;
      border-bottom: 1px solid #fde68a;
      background: #fffbeb
    }

    .dhl-row strong {
      color: #92400e
    }

    .dhl-meta {
      margin-top: 4px;
      color: #713f12;
      font-size: 12px;
      white-space: pre-wrap
    }

    .dhl-empty {
      padding: 22px;
      text-align: center;
      color: #64748b
    }
  .packing-table-wrap{margin:8px 0;overflow-x:auto;border:1px solid #f2d46b;border-radius:8px;background:#fff}.packing-table{width:100%;border-collapse:collapse;font-size:12px}.packing-table th,.packing-table td{padding:7px 8px;border-bottom:1px solid #f5e6aa;text-align:left;vertical-align:top}.packing-table th{background:#fff3b0;color:#713f12;font-weight:800}.packing-table th:first-child,.packing-table td:first-child{width:52px;text-align:center}.packing-table tr:last-child td{border-bottom:0}.dhl-info{margin-top:7px;color:#713f12;font-size:12px}.dhl-info div+div{margin-top:3px}</style>
</head>

<body>
  <main class="card">
    <section id="loginPanel">
      <div class="login-shell">
        <div class="brand">
          <div class="logo-wrap">
            <img src="https://www.copeland.com/49ea62/contentassets/e08202be2dff44d1bcda93f0dae74605/favicon.ico"
              alt="Copeland logo" class="company-logo">
          </div>
        </div>
        <div id="loginStatus" class="status" role="status" aria-live="polite"></div>
        <form id="loginForm" novalidate>
          <span class="app-label" id="appLabel">เลือก App <span class="req">*</span></span>
          <div class="app-grid" role="radiogroup" aria-labelledby="appLabel">
            <button class="app-card" type="button" role="radio" aria-checked="false" data-app="DHLurl"><span
                class="app-check">✓</span><span class="app-icon"><svg viewBox="0 0 64 64" aria-hidden="true">
                  <path d="M7 15h31v29H7z" fill="#FFCC00" />
                  <path d="M38 25h10l9 10v9H38z" fill="#FFCC00" />
                  <path d="M43 29h4l6 7H43z" fill="#eaf4f1" />
                  <path d="M8 40h49v6H8z" fill="#D40511" />
                  <circle cx="18" cy="47" r="7" fill="#1f2937" />
                  <circle cx="18" cy="47" r="3" fill="#cbd5e1" />
                  <circle cx="48" cy="47" r="7" fill="#1f2937" />
                  <circle cx="48" cy="47" r="3" fill="#cbd5e1" />
                </svg></span><span class="app-name">DHL</span></button>
            <button class="app-card" type="button" role="radio" aria-checked="false" data-app="Statorchecker"><span
                class="app-check">✓</span><span class="app-icon"><svg viewBox="0 0 64 64" aria-hidden="true">
                  <circle cx="27" cy="29" r="16" fill="none" stroke="#0F6B3A" stroke-width="7" />
                  <circle cx="27" cy="29" r="8" fill="none" stroke="#69B578" stroke-width="4" />
                  <path d="M39 41l14 14" stroke="#164E63" stroke-width="7" stroke-linecap="round" />
                  <circle cx="48" cy="17" r="11" fill="#0F7A43" />
                  <path d="M43 17l4 4 7-8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg></span><span class="app-name">Stator checker</span></button>
            <button class="app-card" type="button" role="radio" aria-checked="false" data-app="Statorstock"><span
                class="app-check">✓</span><span class="app-icon"><svg viewBox="0 0 64 64" aria-hidden="true">
                  <path d="M8 18l24-10 24 10-24 11z" fill="#7BC58A" />
                  <path d="M8 18v28l24 10V29z" fill="#0F6B3A" />
                  <path d="M56 18v28L32 56V29z" fill="#42A866" />
                  <path d="M24 12l24 10v9" fill="none" stroke="#DFF4E5" stroke-width="4" />
                  <circle cx="44" cy="39" r="9" fill="none" stroke="#D69E2E" stroke-width="4" />
                  <circle cx="44" cy="39" r="4" fill="none" stroke="#8A5A00" stroke-width="3" />
                </svg></span><span class="app-name">Stator stock</span></button>
          </div>
          <div id="appErr" class="app-error">กรุณาเลือก App</div>
          <div class="field">
            <label for="username">Username <span class="req">*</span></label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">👤</span>
              <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false"
                placeholder="กรอก Username">
            </div>
            <div id="usernameErr" class="err">กรุณากรอก Username</div>
          </div>
          <div class="field">
            <label for="password">Password <span class="req">*</span></label>
            <div class="password-wrap input-wrap">
              <span class="input-icon" aria-hidden="true">🔒</span>
              <input id="password" type="password" autocomplete="current-password" placeholder="กรอก Password">
              <button id="showPassword" class="showpass" type="button" aria-label="แสดงรหัสผ่าน">👁</button>
            </div>
            <div id="passwordErr" class="err">กรุณากรอก Password</div>
          </div>
          <button id="loginButton" class="login-btn" type="submit">เข้าสู่ระบบ</button>
        </form>
        <div class="login-note"><span aria-hidden="true">🔐</span> บัญชีสำหรับระบบ CK65 เท่านั้น</div>
      </div>
    </section>

    <section id="entryPanel" class="hidden">
      <div class="userbar">
        <div>ผู้ใช้งาน: <strong id="signedInUser"></strong></div>
        <button id="logoutButton" class="logout" type="button">ออก</button>
      </div>
      <div id="scanStatus" class="status" role="status" aria-live="polite"></div>
      <form id="entryForm" novalidate>
        <div class="field">
          <label for="item">Item <span class="req">*</span></label>
          <input id="item" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
            placeholder="กรอกหรือสแกนพาร์ท">
          <div id="itemErr" class="err">Item ต้องเป็นรูปแบบ 000-0000-00</div>
        </div>
        <div class="field">
          <label for="quantity">จำนวน <span class="req">*</span></label>
          <input id="quantity" type="number" min="0.01" step="0.01" inputmode="decimal" autocomplete="off"
            placeholder="กรอกจำนวน">
          <div id="quantityErr" class="err">กรุณากรอกจำนวนที่มากกว่า 0</div>
        </div>
        <div class="field">
          <label for="location">Location <span class="req">*</span></label>
          <input id="location" maxlength="100" autocomplete="off" placeholder="กรอกหรือสแกน Location">
          <div id="locationErr" class="err">กรุณากรอก Location</div>
        </div>
        <div class="buttons">
          <button class="clear" type="reset">ล้างข้อมูล</button>
          <button id="sendButton" class="primary" type="submit">ตรวจสอบและส่ง</button>
        </div>
      </form>
      <div id="entryMessage" class="msg" role="status" aria-live="polite"></div>
    </section>

       <section id="dhlPanel" class="hidden">
            <div class="dhl-bar">
                <div class="dhl-user"><span class="dhl-title">🚚 ตรวจสอบพัสดุ DHL</span><span>| User:</span><strong
                        id="dhlUser"></strong></div><button class="logout" id="dhlLogout">ออก</button>
            </div>
            <div id="dhlStatus" class="status"></div>
            <form id="dhlForm">
                <div class="dhl-field"><input id="dhlWaybill" placeholder="WAYBILL">
                    <div id="dhlWaybillErr" class="err">กรุณากรอก WAYBILL</div>
                </div>
                <div class="dhl-field"><textarea id="dhlPacking" placeholder="Packing Slip (Invoice)"></textarea></div>
                <div class="dhl-field"><input id="dhlAttach" type="file" multiple accept="image/*,.pdf">

    function clean(v) { return String(v || "").replace(/[\x00-\x1f\x7f]/g, " ").replace(/\s+/g, " ").trim() }
    function formatItemDigits(d) { return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7, 9) }
    function extractScan(v) {
      const s = clean(v);
      let m = s.match(/P\s*(\d{3})[\s-]?(\d{4})[\s-]?(\d{2})/i);
      if (!m) m = s.match(/(?:^|\D)(\d{3})[\s-]?(\d{4})[\s-]?(\d{2})(?:\D|$)/);
      const itemValue = m ? m[1] + "-" + m[2] + "-" + m[3] : "";
      const q = s.match(/Q\s*([0-9]+(?:\.[0-9]+)?)/i);
      return { item: itemValue, quantity: q ? q[1] : "", raw: s };
    }
    function extractItem(v) { return extractScan(v).item }
    function applyScan(v) {
      const data = extractScan(v); console.log("Raw Data Matrix:", JSON.stringify(v), data);
      if (!data.item) return false;
      isApplying = true;
      item.value = data.item;
      item.classList.remove("bad", "valid");
      if (data.quantity) quantity.value = data.quantity;
      if (locationInput.value && (/P\s*\d/i.test(locationInput.value) || clean(locationInput.value).includes(data.item))) locationInput.value = "";
      setStatus(scanStatus, "อ่าน Data Matrix ได้: " + data.item + (data.quantity ? " | จำนวน " + data.quantity : ""), "ok");
      setTimeout(() => { isApplying = false; (data.quantity ? locationInput : quantity).focus(); if (!data.quantity) quantity.select() }, 50);
      return true;
    }
    function finishScan() {
      clearTimeout(scanTimer); const value = scanBuffer; scanBuffer = ""; scanStarted = 0;
      if (!value) return false;
      const valid = applyScan(value);
      if (!valid && clean(value).length > 7) setStatus(scanStatus, "ไม่พบ Item กรุณาสแกนใหม่", "fail");
      return valid;
    }
    document.addEventListener("keydown", e => {
      if (entryPanel.classList.contains("hidden") || e.ctrlKey || e.altKey || e.metaKey) return;
      const now = Date.now();
      if (e.key === "Enter" || e.key === "Tab") {
        if (scanBuffer.length > 3) { e.preventDefault(); e.stopImmediatePropagation(); clearTimeout(scanTimer); scanTimer = setTimeout(finishScan, 60) }
        return;
      }
      if (e.key.length !== 1) return;
      if (!scanStarted || now - scanStarted > 160) { scanBuffer = "" }
      scanStarted = now; scanBuffer += e.key;
      clearTimeout(scanTimer); scanTimer = setTimeout(finishScan, 500);
    }, true);
    [item, quantity, locationInput].filter(Boolean).forEach(el => el.addEventListener("input", () => {
      if (isApplying) return;
      const raw = el.value;
      if (/[Pp][\s\d-]{7,}|[Qq]\s*\d+|[)>\x1d\x1e\x1d]/.test(raw)) {
        clearTimeout(scanTimer); scanBuffer += raw;
        if (el !== item) el.value = "";
        scanTimer = setTimeout(finishScan, 500);

    }));

      item.classList.remove("valid"); if (isApplying) return;

      let digits = current.replace(/\D/g, "").slice(0, 9), formatted = digits.slice(0, 3);
      if (digits.length > 3) formatted += "-" + digits.slice(3, 7);
      if (digits.length > 7) formatted += "-" + digits.slice(7);
      if (!/[A-Za-z,>.\[\]()]/.test(current)) item.value = formatted;
    });

      e.preventDefault(); if (!currentUser) { logout(); return } const q = Number(quantity.value), badItem = !ITEM_PATTERN.test(item.value), badQty = !Number.isFinite(q) || q <= 0, badLoc = !locationInput.value.trim(); setInvalid(item, "#itemErr", badItem); setInvalid(quantity, "#quantityErr", badQty); setInvalid(locationInput, "#locationErr", badLoc); if (badItem || badQty || badLoc) return;

    const dhlPanel = document.querySelector("#dhlPanel"), dhlForm = document.querySelector("#dhlForm"), dhlStatus = document.querySelector("#dhlStatus"), dhlWaybill = document.querySelector("#dhlWaybill"), dhlAttach = document.querySelector("#dhlAttach"), dhlFileList = document.querySelector("#dhlFiles"), dhlModal = document.querySelector("#dhlModal"), dhlResults = document.querySelector("#dhlResults");
    function escapeHtml(v) { const d = document.createElement("div"); d.textContent = String(v ?? ""); return d.innerHTML }
    function thaiDate(v) { if (!v) return "-"; const d = new Date(v); return Number.isNaN(d.getTime()) ? String(v) : new Intl.DateTimeFormat("th-TH", { timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(d) }

    function displayValue(value){if(value===undefined||value===null)return "";if(Array.isArray(value))return value.map(displayValue).filter(Boolean).join(", ");if(typeof value==="object"){for(const key of ["Value","value","Label","label","Title","title","Name","name","DisplayName","displayName"]){const result=displayValue(value[key]);if(result)return result}if(Array.isArray(value.results))return value.results.map(displayValue).filter(Boolean).join(", ");return ""}return String(value).trim()}

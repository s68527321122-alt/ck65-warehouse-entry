<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#edf4f8">
  <title>CK65 Warehouse Entry</title>
  <link href="https://www.copeland.com/49ea62/contentassets/e08202be2dff44d1bcda93f0dae74605/favicon.ico" rel="icon"
    type="image/x-icon">
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%
    }

    body {
      background: #edf4f8;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: #111827;
      padding: 6px
    }

    .card {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .13);
      padding: 16px
    }

    .hidden {
      display: none !important
    }

    .userbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding: 9px 11px;
      border-radius: 9px;
      background: #f1f5f9;
      font-size: 13px
    }

    .userbar strong {
      display: block;
      max-width: 305px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .logout {
      height: 34px;
      padding: 0 12px;
      background: #64748b;
      color: #fff
    }

    .field {
      margin-bottom: 13px
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 700
    }

    .req {
      color: #c50f1f
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 8px 12px;
      font: inherit;
      font-size: 16px;
      outline: none;
      background: #fff
    }

    input:focus {
      border-color: #107c10;
      box-shadow: 0 0 0 3px rgba(16, 124, 16, .13)
    }

    input.bad {
      border-color: #c50f1f;
      background: #fff7f7
    }

    input.valid {
      border-color: #107c10;
      background: #f0fdf4
    }

    .err {
      display: none;
      margin-top: 4px;
      color: #c50f1f;
      font-size: 12px
    }

    .status,
    .msg {
      display: none;
      padding: 9px 11px;
      border-radius: 9px;
      margin-bottom: 12px;
      font-size: 13px
    }

    .ok {
      display: block;
      background: #dcfce7;
      color: #166534
    }

    .fail {
      display: block;
      background: #fee2e2;
      color: #991b1b
    }

    .checking {
      display: block;
      background: #e0f2fe;
      color: #075985
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    button {
      height: 48px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-weight: 700;
      cursor: pointer
    }

    .clear {
      background: #e5ebf1;
      color: #111827
    }

    .primary {
      background: #107c10;
      color: #fff
    }

    .login-btn {
      width: 100%;
      background: #107c10;
      color: #fff
    }

    .password-wrap {
      position: relative
    }

    .password-wrap input {
      padding-right: 72px
    }

    .showpass {
      position: absolute;
      right: 5px;
      top: 5px;
      width: 62px;
      height: 38px;
      background: #e5ebf1;
      font-size: 12px
    }

    button:disabled {
      opacity: .6;
      cursor: wait
    }

    .login-title {
      font-size: 20px;
      font-weight: 750;
      text-align: center;
      margin: 3px 0 16px
    }

    .login-note {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      margin-top: 10px
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      margin-right: 6px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      vertical-align: -2px;
      animation: spin .7s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }


    .app-label {
      display: block;
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 700;
      color: #334155
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 15px
    }

    .app-card {
      position: relative;
      height: 86px;
      padding: 8px 5px;
      border: 1px solid #d8e2dc;
      border-radius: 12px;
      background: #f8fbf9;
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: none;
      transition: .15s ease
    }

    .app-card:hover {
      border-color: #72b98e;
      background: #f2fbf5
    }

    .app-card.selected {
      border: 2px solid #107c10;
      background: #eaf8ee;
      color: #0f5132;
      box-shadow: 0 0 0 3px rgba(16, 124, 16, .10)
    }

    .app-icon {
      position: relative;
      width: 48px;
      height: 40px;
      display: block
    }

    .app-icon svg {
      width: 100%;
      height: 100%;
      display: block
    }

    .app-name {
      font-size: 11px;
      font-weight: 800;
      line-height: 1.15;
      white-space: normal;
      text-align: center
    }

    .app-check {
      display: none;
      position: absolute;
      right: 6px;
      top: 5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #107c10;
      color: #fff;
      font-size: 12px;
      line-height: 18px;
      text-align: center
    }

    .app-card.selected .app-check {
      display: block
    }

    .app-error {
      display: none;
      margin: -8px 0 11px;
      color: #c50f1f;
      font-size: 12px
    }

    /* Modern login screen */
    #loginPanel {
      position: relative;
      margin: -16px;
      padding: 28px 20px 22px;
      min-height: calc(100vh - 12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      border-radius: 12px;
      background: linear-gradient(145deg, #f1fff5 0%, #ffffff 48%, #e7f4ec 100%)
    }

    #loginPanel::before,
    #loginPanel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none
    }

    #loginPanel::before {
      width: 230px;
      height: 230px;
      right: -115px;
      top: -105px;
      background: rgba(0, 132, 61, .10)
    }

    #loginPanel::after {
      width: 170px;
      height: 170px;
      left: -100px;
      bottom: -80px;
      background: rgba(0, 132, 61, .08)
    }

    .login-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      padding: 26px 20px 22px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(16, 124, 16, .13);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, .14)
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 14px
    }

    .logo-wrap {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin-bottom: 12px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid #dce9df;
      box-shadow: 0 9px 22px rgba(0, 100, 45, .14)
    }

    .company-logo {
      width: 48px;
      height: 48px;
      object-fit: contain
    }

    .system-name {
      margin: 0;
      color: #0f5132;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase
    }

    .login-title {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin: 5px 0 4px;
      color: #111827
    }

    .login-subtitle {
      margin: 0;
      color: #64748b;
      font-size: 13px
    }

    #loginPanel label {
      font-size: 13px;
      color: #334155
    }

    #loginPanel input {
      height: 52px;
      border-radius: 11px;
      background: #f8fafc;
      border-color: #d5dee8;
      padding-left: 42px
    }

    #loginPanel input:focus {
      background: #fff
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      color: #64748b;
      pointer-events: none
    }

    .input-wrap {
      position: relative
    }

    .password-wrap input {
      padding-right: 58px
    }

    .showpass {
      right: 7px;
      top: 7px;
      width: 42px;
      height: 38px;
      border-radius: 8px;
      font-size: 18px;
      line-height: 1;
      background: #e8f2eb;
      color: #166534
    }

    .login-btn {
      height: 52px;
      margin-top: 3px;
      border-radius: 11px;
      background: linear-gradient(135deg, #107c10, #006b3c);
      box-shadow: 0 8px 18px rgba(16, 124, 16, .24);
      transition: transform .15s ease, box-shadow .15s ease
    }

    .login-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(16, 124, 16, .20)
    }

    .login-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 15px;
      color: #64748b
    }

    @media(max-width:520px) {
      .app-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px
      }

      .app-card {
        height: 82px;
        padding: 7px 3px
      }

      .app-icon {
        width: 44px;
        height: 37px
      }

      .app-name {
        font-size: 10px
      }

      body {
        padding: 0;
        background: #eef7f1
      }

      .card {
        max-width: none;
        min-height: 100vh;
        border-radius: 0;
        padding: 16px;
        box-shadow: none
      }

      #loginPanel {
        min-height: calc(100vh - 32px);
        border-radius: 14px;
        padding: 20px 10px
      }

      .login-shell {
        padding: 24px 18px 20px
      }
    }

    /* DHL Material Inspection */
    #dhlPanel {
      padding: 0
    }

    .dhl-hero {
      margin: -16px -16px 14px;
      padding: 16px;
      background: linear-gradient(135deg, #FFCC00, #ffe680);
      border-bottom: 4px solid #D40511
    }

    .dhl-hero h2 {
      margin: 0;
      color: #D40511;
      font-size: 20px
    }

    .dhl-hero p {
      margin: 3px 0 0;
      color: #713f12;
      font-size: 12px
    }

    .dhl-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 13px;
      padding: 9px 11px;
      border-radius: 9px;
      background: #f1f5f9;
      font-size: 12px
    }

    .dhl-user {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .dhl-field {
      margin-bottom: 13px
    }

    .dhl-field textarea {
      width: 100%;
      min-height: 76px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
      resize: vertical
    }

    .dhl-field input {
      height: 48px
    }

    .dhl-filebox {
      padding: 11px;
      border: 1px dashed #d4a90a;
      border-radius: 9px;
      background: #fffbeb
    }

    .dhl-files {
      list-style: none;
      padding: 0;
      margin: 8px 0 0
    }

    .dhl-files li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      padding: 7px 9px;
      border-radius: 7px;
      background: #fff;
      font-size: 12px
    }

    .dhl-remove {
      height: auto;
      padding: 3px 7px;
      background: #fee2e2;
      color: #991b1b
    }

    .dhl-actions {
      display: grid;
      grid-template-columns: 1.15fr .8fr 1.2fr;
      gap: 7px
    }

    .dhl-actions button {
      height: 46px;
      font-size: 12px
    }

    .dhl-latest {
      background: #FFCC00;
      color: #713f12
    }

    .dhl-submit {
      background: #D40511;
      color: #fff
    }

    .dhl-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      padding: 16px;
      background: #0f172a8c;
      align-items: center;
      justify-content: center
    }

    .dhl-modal.show {
      display: flex
    }

    .dhl-modalbox {
      width: min(100%, 520px);
      max-height: 88vh;
      overflow: hidden;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 22px 55px #0005
    }

    .dhl-modalhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #FFCC00;
      color: #D40511
    }

    .dhl-close {
      width: 38px;
      height: 34px;
      background: #64748b;
      color: #fff
    }

    .dhl-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
      padding: 12px
    }

    .dhl-search input {
      height: 42px
    }

    .dhl-search button {
      height: 42px;
      padding: 0 12px;
      background: #107c10;
      color: #fff
    }

    .dhl-showlatest {
      grid-column: 1/-1;
      background: #FFCC00 !important;
      color: #713f12 !important
    }

    .dhl-results {
      max-height: 58vh;
      overflow: auto;
      padding: 0 12px 12px
    }

    .dhl-row {
      padding: 10px;
      border-bottom: 1px solid #fde68a;
      background: #fffbeb
    }

    .dhl-row strong {
      color: #92400e
    }

    .dhl-meta {
      margin-top: 4px;
      color: #713f12;
      font-size: 12px;
      white-space: pre-wrap
    }

    .dhl-empty {
      padding: 22px;
      text-align: center;
      color: #64748b
    }
  
    /* Login: remove outer decorative frame */
    #loginPanel {
      margin: 0;
      padding: 24px 0;
      min-height: calc(100vh - 44px);
      overflow: visible;
      border-radius: 0;
      background: transparent
    }

    #loginPanel::before,
    #loginPanel::after {
      display: none
    }

    @media(max-width:520px) {
      #loginPanel {
        min-height: calc(100vh - 32px);
        padding: 20px 0;
        border-radius: 0;
        background: transparent
      }
    }
  
    /* Login: remove inner card frame */
    .login-shell {
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none
    }
  
    /* Small screen responsive improvements */
    html,body{overflow-x:hidden}
    .login-shell,#loginPanel,.card{min-width:0}
    #loginPanel input,.dhl-field input,.dhl-field textarea{max-width:100%}
    .packing-table-wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .dhl-modalbox{max-width:calc(100vw - 20px)}

    @media(max-width:390px){
      body{padding:0}
      .card{width:100%;padding:10px}
      #loginPanel{padding:10px 0;min-height:100vh}
      .login-shell{max-width:100%;padding:12px 6px 14px}
      .brand{margin-bottom:10px}
      .logo-wrap{width:64px;height:64px;margin-bottom:8px;border-radius:16px}
      .company-logo{width:42px;height:42px}
      .app-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:12px}
      .app-card{min-width:0;height:76px;padding:6px 2px;border-radius:10px}
      .app-icon{width:40px;height:33px}
      .app-name{font-size:9px;line-height:1.1;overflow-wrap:anywhere}
      #loginPanel input{height:46px;font-size:15px}
      .field{margin-bottom:10px}
      .login-btn{height:48px}
      .login-note{margin-top:10px;font-size:10px}
      .dhl-bar{gap:5px;padding:8px;font-size:11px}
      .dhl-user{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .dhl-field{margin-bottom:10px}
      .dhl-actions{grid-template-columns:1fr;gap:6px}
      .dhl-actions button{width:100%;height:44px}
      .dhl-modal{padding:8px}
      .dhl-modalbox{width:100%;max-width:100%;max-height:94vh;border-radius:12px}
      .dhl-modalhead{padding:10px;font-size:13px}
      .dhl-search{grid-template-columns:minmax(0,1fr) auto;gap:5px;padding:8px}
      .dhl-search input{min-width:0;font-size:14px}
      .dhl-search button{padding:0 9px;font-size:12px}
      .dhl-showlatest{grid-column:1/-1}
      .dhl-results{max-height:64vh;padding:0 8px 8px}
      .dhl-row{padding:9px 7px}
    }

    @media(max-width:340px){
      .card{padding:8px}
      .login-shell{padding-left:2px;padding-right:2px}
      .app-grid{gap:4px}
      .app-card{height:72px}
      .app-icon{width:36px;height:30px}
      .app-name{font-size:8px}
      #loginPanel label{font-size:12px}
      #loginPanel input{font-size:14px;padding-left:38px}
      .input-icon{left:12px;font-size:15px}
      .showpass{width:38px}
      .dhl-search{grid-template-columns:1fr}
      .dhl-search button,.dhl-showlatest{grid-column:1}
    }
  
    /* Copeland horizontal logo */
    .logo-wrap{width:190px;height:72px;padding:10px 14px;border-radius:16px}
    .company-logo{width:100%;height:100%;object-fit:contain;display:block}
    @media(max-width:390px){.logo-wrap{width:170px;height:64px;padding:9px 12px}}
    @media(max-width:340px){.logo-wrap{width:150px;height:58px;padding:8px 10px}}
  
    /* Copeland logo reduced by 50 percent */
    .logo-wrap{width:95px;height:36px;padding:5px 7px;border-radius:8px}
    @media(max-width:390px){.logo-wrap{width:85px;height:32px;padding:4px 6px}}
    @media(max-width:340px){.logo-wrap{width:75px;height:29px;padding:4px 5px}}
  
    /* Clean login without visible field labels */
    .app-grid{margin-top:0}
    #loginForm>.field{margin-bottom:12px}
    .brand{margin-bottom:10px}
  
    /* Login background fits content */
    body{min-height:100%;background:#edf4f8}
    .card{min-height:0}
    #loginPanel{
      min-height:0;
      height:auto;
      justify-content:flex-start;
      padding:12px 0;
      margin:0;
      background:#fff
    }
    .login-shell{
      height:auto;
      min-height:0;
      margin:0 auto;
      padding-bottom:14px
    }
    @media(max-width:520px){
      body{min-height:100%;background:#edf4f8}
      .card{min-height:0;padding:10px}
      #loginPanel{min-height:0;height:auto;padding:10px 0}
      .login-shell{min-height:0;height:auto;padding-bottom:12px}
    }
  </style>
</head>

<body>
  <main class="card">
    <section id="loginPanel">
      <div class="login-shell">

    function clean(v) { return String(v || "").replace(/[\x00-\x1f\x7f]/g, " ").replace(/\s+/g, " ").trim() }
    function formatItemDigits(d) { return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7, 9) }
    function extractScan(v) {
      const s = clean(v);
      let m = s.match(/P\s*(\d{3})[\s-]?(\d{4})[\s-]?(\d{2})/i);
      if (!m) m = s.match(/(?:^|\D)(\d{3})[\s-]?(\d{4})[\s-]?(\d{2})(?:\D|$)/);
      const itemValue = m ? m[1] + "-" + m[2] + "-" + m[3] : "";
      const q = s.match(/Q\s*([0-9]+(?:\.[0-9]+)?)/i);
      return { item: itemValue, quantity: q ? q[1] : "", raw: s };
    }
    function extractItem(v) { return extractScan(v).item }
    function applyScan(v) {
      const data = extractScan(v); console.log("Raw Data Matrix:", JSON.stringify(v), data);
      if (!data.item) return false;
      isApplying = true;
      item.value = data.item;
      item.classList.remove("bad", "valid");

      setStatus(scanStatus, "อ่าน Data Matrix ได้: " + data.item + (data.quantity ? " | จำนวน " + data.quantity : ""), "ok");
      setTimeout(() => { isApplying = false; (data.quantity ? locationInput : quantity).focus(); if (!data.quantity) quantity.select() }, 50);
      return true;
    }
    function finishScan() {
      clearTimeout(scanTimer); const value = scanBuffer; scanBuffer = ""; scanStarted = 0;
      if (!value) return false;
      const valid = applyScan(value);
      if (!valid && clean(value).length > 7) setStatus(scanStatus, "ไม่พบ Item กรุณาสแกนใหม่", "fail");
      return valid;
    }
    document.addEventListener("keydown", e => {
      if (entryPanel.classList.contains("hidden") || e.ctrlKey || e.altKey || e.metaKey) return;
      const now = Date.now();
      if (e.key === "Enter" || e.key === "Tab") {
        if (scanBuffer.length > 3) { e.preventDefault(); e.stopImmediatePropagation(); clearTimeout(scanTimer); scanTimer = setTimeout(finishScan, 60) }
        return;
      }
      if (e.key.length !== 1) return;
      if (!scanStarted || now - scanStarted > 160) { scanBuffer = "" }
      scanStarted = now; scanBuffer += e.key;
      clearTimeout(scanTimer); scanTimer = setTimeout(finishScan, 500);
    }, true);
    [item, quantity, locationInput].filter(Boolean).forEach(el => el.addEventListener("input", () => {
      if (isApplying) return;
      const raw = el.value;
      if (/[Pp][\s\d-]{7,}|[Qq]\s*\d+|[)>\x1d\x1e\x1d]/.test(raw)) {

      if (digits.length > 7) formatted += "-" + digits.slice(7);

    const dhlPanel = document.querySelector("#dhlPanel"), dhlForm = document.querySelector("#dhlForm"), dhlStatus = document.querySelector("#dhlStatus"), dhlWaybill = document.querySelector("#dhlWaybill"), dhlAttach = document.querySelector("#dhlAttach"), dhlFileList = document.querySelector("#dhlFiles"), dhlModal = document.querySelector("#dhlModal"), dhlResults = document.querySelector("#dhlResults");
    function escapeHtml(v) { const d = document.createElement("div"); d.textContent = String(v ?? ""); return d.innerHTML }

<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Warehouse Apps</title><style>
*{box-sizing:border-box}body{margin:0;padding:8px;background:#edf4f8;font-family:Segoe UI,Tahoma,Arial;color:#111827}.card{max-width:500px;margin:auto;padding:16px;background:#fff;border-radius:14px;box-shadow:0 8px 24px #0002}.hidden{display:none!important}.field{margin-bottom:13px}label{display:block;margin-bottom:5px;font-weight:700}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;font:inherit;font-size:16px;background:#fff}input,select{height:48px}textarea{height:56px;min-height:56px;resize:vertical}.bad{border-color:#b91c1c!important}.err{display:none;color:#b91c1c;font-size:12px;margin-top:4px}.status{display:none;margin-bottom:12px;padding:9px 11px;border-radius:9px;font-size:13px;white-space:pre-wrap}.ok{display:block;background:#dcfce7;color:#166534}.fail{display:block;background:#fee2e2;color:#991b1b}.checking{display:block;background:#e0f2fe;color:#075985}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dhl-actions{grid-template-columns:1.15fr .8fr 1.2fr}.dhl-actions .yellow{width:auto;height:46px;margin:0;font-size:12px;padding:0 7px}button{height:46px;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.green{background:#107c10;color:#fff}.red{background:#e30613;color:#fff}.gray{background:#ececec}.yellow{width:100%;height:42px;margin-bottom:13px;background:#facc15;color:#713f12}.bar{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:13px;padding:9px;border-radius:9px;background:#f1f5f9;font-size:12px}.line{display:flex;gap:4px;white-space:nowrap;overflow:hidden}.line strong{overflow:hidden;text-overflow:ellipsis}.dhl-title{color:#d40511;font-weight:800}.logout{height:34px;padding:0 10px;background:#64748b;color:#fff}.files{list-style:none;padding:0;margin:7px 0;font-size:12px}.files li{display:flex;justify-content:space-between;margin-top:10px;padding:7px 9px;background:#f8fafc;border-radius:7px}.remove{height:auto;padding:0;background:none;color:#b91c1c}.modal{display:none;position:fixed;inset:0;z-index:1000;padding:18px;background:rgba(15,23,42,.55);align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{width:min(100%,520px);max-height:86vh;overflow:hidden;background:#fff;border-radius:15px;box-shadow:0 22px 55px #0005}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:#f1f5f9}.modal-head strong{color:#d40511}.close{width:38px;height:34px;background:#64748b;color:#fff}.modal-search{display:grid;grid-template-columns:1fr auto;gap:7px;padding:12px 12px 0}.modal-search input{height:42px;border-color:#facc15}.search-btn{height:42px;padding:0 14px;background:#107c10;color:#fff}.show-latest-btn{grid-column:1/-1;height:38px;background:#facc15;color:#713f12}.modal-body{max-height:62vh;overflow:auto;padding:12px}.latest-item{padding:11px 7px;border-bottom:1px solid #fde68a;background:#fffbeb}.latest-item:first-child{border-radius:9px 9px 0 0}.latest-item:last-child{border-bottom:0;border-radius:0 0 9px 9px}.latest-no{color:#b45309;font-weight:800}.latest-way{font-weight:800}.latest-meta{padding-left:24px;margin-top:4px;color:#713f12;font-size:12px;white-space:pre-wrap}.empty{padding:22px;text-align:center;color:#64748b}.spinner{display:inline-block;width:13px;height:13px;margin-right:6px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><main class="card">
<section id="login"><h2 style="text-align:center">ลงชื่อเข้าใช้</h2><div id="loginMsg" class="status"></div><form id="loginForm"><div class="field"><label>เลือก App</label><select id="app"><option value="CK65url">📦 CK65 Warehouse Entry</option><option value="DHLurl">🚚 DHL Material Inspection</option></select></div><div class="field"><label>Username *</label><input id="user"><div id="userErr" class="err">กรุณากรอก Username</div></div><div class="field"><label>Password *</label><input id="pass" type="password"><div id="passErr" class="err">กรุณากรอก Password</div></div><button class="green" style="width:100%">เข้าสู่ระบบ</button></form></section>
<section id="ck" class="hidden"><div class="bar"><div class="line">📦 CK65 | User: <strong id="ckUser"></strong></div><button class="logout" data-out>ออก</button></div><div id="ckMsg" class="status"></div><form id="ckForm"><div class="field"><label>Item *</label><input id="item" placeholder="000-0000-00"><div id="itemErr" class="err">รูปแบบ 000-0000-00</div></div><div class="field"><label>จำนวน *</label><input id="qty" type="number" min="0.01"><div id="qtyErr" class="err">จำนวนต้องมากกว่า 0</div></div><div class="field"><label>Location *</label><input id="loc"><div id="locErr" class="err">กรุณากรอก Location</div></div><div class="buttons"><button type="reset" class="gray">ล้าง</button><button class="green">ตรวจสอบและส่ง</button></div></form></section>
<section id="dhl" class="hidden"><div class="bar"><div class="line"><span class="dhl-title">🚚 ตรวจสอบพัสดุ DHL</span><span>| User:</span><strong id="dhlUser"></strong></div><button class="logout" data-out>ออก</button></div><div id="dhlMsg" class="status"></div><form id="dhlForm"><div class="field"><input id="waybill" placeholder="WAYBILL"><div id="wayErr" class="err">กรุณากรอก WAYBILL</div></div><div class="field"><textarea id="packing" placeholder="Packing Slip (Invoice)"></textarea></div><div class="field"><input id="attach" type="file" multiple accept="image/*,.pdf"><div id="attachErr" class="err">กรุณาแนบไฟล์</div><ul id="files" class="files"></ul></div><div class="field"><input id="remark" list="remarkList" placeholder="เลือกหรือพิมพ์เพิ่ม" aria-label="Remark"><datalist id="remarkList"><option value="PART"><option value="Tools Crib"><option value="SURACHET"><option value="SAENGJAN"><option value="BOWORN"><option value="KANYALUCK"><option value="SCROLL/ SARINYA"><option value="WEERAWUT"><option value="SAMIT"><option value="CHALERMCHAI"><option value="THANPISA"><option value="ITTIRIT"><option value="WISANU"><option value="SAKDA"><option value="Jiravat"></datalist></div><div class="buttons dhl-actions"><button id="latestBtn" type="button" class="yellow">📋 ล่าสุด 10 รายการ</button><button type="reset" class="gray">ล้าง</button><button class="red">Submit / บันทึก</button></div></form></section></main>
<div id="latestModal" class="modal" role="dialog" aria-modal="true"><div class="modal-box"><div class="modal-head"><strong>📋 รายการล่าสุด 10 รายการ</strong><button id="closeModal" class="close" type="button">✕</button></div><div class="modal-search"><input id="waybillSearch" type="search" inputmode="numeric" autocomplete="off" placeholder="ค้นหา WAYBILL..." aria-label="ค้นหา WAYBILL"><button id="searchWaybillButton" class="search-btn" type="button">ค้นหา</button><button id="showLatestButton" class="show-latest-btn" type="button">แสดง 10 รายการล่าสุด</button></div><div id="modalBody" class="modal-body"></div></div></div>
<script>'use strict';const LOGIN_FLOW_URL='https://default49d8b68c499440779e38e112c21fd0.e3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/12eb496a14694a46be3f7baac94776af/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=5AzPaEhlQITweSyxj7iF8hZ2jn8YYYO6two1_hirDpI';let me=null,flowUrl='',files=[],latestRows=[];const $=q=>document.querySelector(q);function status(e,t,c){e.textContent=t;e.className='status '+c}function invalid(e,id,v){e.classList.toggle('bad',v);$(id).style.display=v?'block':'none'}async function json(r){const t=await r.text();if(!t)return{};try{return JSON.parse(t)}catch{throw Error('Flow ตอบกลับไม่ใช่ JSON HTTP '+r.status)}}function openApp(app,u,url){me=u;flowUrl=url;sessionStorage.setItem('warehouseApp',JSON.stringify({...u,app,url}));$('#login').classList.add('hidden');$('#ck').classList.toggle('hidden',app!=='CK65url');$('#dhl').classList.toggle('hidden',app!=='DHLurl');$('#ckUser').textContent=u.displayName;$('#dhlUser').textContent=u.displayName}function logout(){sessionStorage.removeItem('warehouseApp');me=null;flowUrl='';$('#ck').classList.add('hidden');$('#dhl').classList.add('hidden');$('#login').classList.remove('hidden')}document.querySelectorAll('[data-out]').forEach(b=>b.onclick=logout);
$('#loginForm').onsubmit=async e=>{e.preventDefault();const employeeId=$('#user').value.trim(),password=$('#pass').value,appName=$('#app').value;invalid($('#user'),'#userErr',!employeeId);invalid($('#pass'),'#passErr',!password);if(!employeeId||!password)return;try{status($('#loginMsg'),'กำลังตรวจสอบ...','checking');const r=await fetch(LOGIN_FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({appName,employeeId,password})}),x=await json(r);if(!r.ok||(!x.valid&&!x.authorized))throw Error(x.message||'เข้าสู่ระบบไม่สำเร็จ');const u=appName==='DHLurl'?(x.dhlFlowUrl||x.flowUrl):(x.ck65FlowUrl||x.flowUrl);if(!u)throw Error('ไม่พบ flowUrl');openApp(appName,{username:employeeId,displayName:x.displayName||employeeId},u)}catch(er){status($('#loginMsg'),er.message,'fail')}};
$('#ckForm').onsubmit=async e=>{e.preventDefault();const Item=$('#item').value.trim(),Quantity=Number($('#qty').value),Location=$('#loc').value.trim(),a=!/^\d{3}-\d{4}-\d{2}$/.test(Item),q=!Quantity||Quantity<=0,l=!Location;invalid($('#item'),'#itemErr',a);invalid($('#qty'),'#qtyErr',q);invalid($('#loc'),'#locErr',l);if(a||q||l)return;try{const r=await fetch(flowUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Item,Quantity,Location,UserName:me.displayName,UserLogin:me.username,SubmittedAt:new Date().toISOString()})}),x=await json(r);if(!r.ok)throw Error(x.message||'HTTP '+r.status);status($('#ckMsg'),x.message||'บันทึกเรียบร้อย','ok')}catch(er){status($('#ckMsg'),er.message,'fail')}};
function renderFiles(){ $('#files').innerHTML='';files.forEach((f,i)=>{const li=document.createElement('li'),b=document.createElement('button');li.textContent=f.name;b.type='button';b.className='remove';b.textContent='✕';b.onclick=()=>{files.splice(i,1);renderFiles()};li.append(b);$('#files').append(li)})}$('#attach').onchange=e=>{for(const f of e.target.files)if(!files.some(x=>x.name===f.name&&x.size===f.size))files.push(f);e.target.value='';renderFiles()};function b64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(f)})}function value(row,a,b){const v=row?.[a]??row?.[b];return v&&typeof v==='object'?(v.Value??''):(v??'')}function showModal(){ $('#latestModal').classList.add('show');document.body.style.overflow='hidden'}function hideModal(){ $('#latestModal').classList.remove('show');document.body.style.overflow=''}$('#closeModal').onclick=hideModal;$('#latestModal').onclick=e=>{if(e.target.id==='latestModal')hideModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal()});function formatThaiDate(value){if(!value)return'';const date=new Date(value);if(Number.isNaN(date.getTime()))return String(value);return new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(date)}function renderLatest(rows){const box=$('#modalBody');box.innerHTML='';if(!rows.length){box.innerHTML='<div class="empty">ไม่พบรายการ DHL</div>';return}rows.slice(0,10).forEach((r,i)=>{const d=document.createElement('div');d.className='latest-item';const wb=value(r,'waybill','Title'),pk=value(r,'packingSlip','Packing_x0020_Slip_x0020__x0028_'),rm=value(r,'remark','Remark'),dt=value(r,'verifiedDate','Modified');d.innerHTML='<span class="latest-no">'+(i+1)+'.</span> <span class="latest-way">WAYBILL: '+String(wb||'-').replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</span>';const meta=document.createElement('div');meta.className='latest-meta';meta.textContent=(pk?'Packing Slip: '+pk:'')+(rm?(pk?'\n':'')+'Remark: '+rm:'')+(dt?((pk||rm)?'\n':'')+'วันที่: '+formatThaiDate(dt):'');d.append(meta);box.append(d)})}async function searchWaybill(){const keyword=$('#waybillSearch').value.trim(),button=$('#searchWaybillButton'),box=$('#modalBody');if(!keyword){box.innerHTML='<div class="empty">กรุณากรอกเลข WAYBILL</div>';$('#waybillSearch').focus();return}button.disabled=true;button.textContent='กำลังค้นหา';box.innerHTML='<div class="empty">กำลังค้นหา WAYBILL...</div>';try{const r=await fetch(flowUrl,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({action:'SearchDHLByWaybill',waybill:keyword})}),x=await json(r);if(!r.ok||x.success===false)throw Error(x.message||'HTTP '+r.status);const rows=Array.isArray(x.data)?x.data:Array.isArray(x.items)?x.items:Array.isArray(x.value)?x.value:(x.data&&typeof x.data==='object'?[x.data]:[]);renderLatest(rows)}catch(er){box.innerHTML='<div class="empty">ค้นหาไม่สำเร็จ: '+er.message+'</div>'}finally{button.disabled=false;button.textContent='ค้นหา'}}
$('#searchWaybillButton').addEventListener('click',searchWaybill);
$('#waybillSearch').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();searchWaybill()}});
$('#showLatestButton').addEventListener('click',()=>{renderLatest(latestRows);$('#waybillSearch').value=''});$('#latestBtn').onclick=async()=>{showModal();$('#waybillSearch').value='';$('#modalBody').innerHTML='<div class="empty">กำลังโหลดรายการ...</div>';try{const r=await fetch(flowUrl,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({action:'GetLatest10DHLInspections',top:10})}),x=await json(r);if(!r.ok||x.success===false)throw Error(x.message||'HTTP '+r.status);const rows=Array.isArray(x.data)?x.data:Array.isArray(x.value)?x.value:[];latestRows=rows.slice(0,10);renderLatest(latestRows);setTimeout(()=>$('#waybillSearch').focus(),0)}catch(er){$('#modalBody').innerHTML='<div class="empty">ตรวจสอบไม่สำเร็จ: '+er.message+'</div>'}};
$('#dhlForm').onreset=()=>setTimeout(()=>{files=[];renderFiles()},0);$('#dhlForm').onsubmit=async e=>{e.preventDefault();const waybill=$('#waybill').value.trim(),bw=!waybill,bf=!files.length;invalid($('#waybill'),'#wayErr',bw);$('#attachErr').style.display=bf?'block':'none';if(bw||bf)return;try{status($('#dhlMsg'),'กำลังส่ง...','checking');const attachments=await Promise.all(files.map(async f=>({fileName:f.name,contentType:f.type||'application/octet-stream',contentBytes:await b64(f)})));const body={action:'CreateDHLInspection',waybill,packingSlip:$('#packing').value.trim(),remark:$('#remark').value.trim(),verifiedBy:me.displayName,verifiedByLogin:me.username,verifiedDate:new Date().toISOString(),attachments};const r=await fetch(flowUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),x=await json(r);if(!r.ok||x.success===false)throw Error(x.message||'HTTP '+r.status);status($('#dhlMsg'),x.message||'บันทึกเรียบร้อย','ok');$('#dhlForm').reset();setTimeout(()=>$('#waybill').focus(),0)}catch(er){status($('#dhlMsg'),'บันทึกไม่สำเร็จ: '+er.message,'fail')}};window.onload=()=>{let x;try{x=JSON.parse(sessionStorage.getItem('warehouseApp'))}catch{}if(x)openApp(x.app,x,x.url)};</script></body></html>

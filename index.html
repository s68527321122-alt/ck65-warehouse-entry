<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>บันทึกรายการสินค้า</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #edf4f8;
            font-family: Segoe UI, Tahoma, sans-serif;
            color: #111827;
            padding: 6px
        }

        .card {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 28px #0f172a20;
            padding: 16px
        }

        .field {
            margin-bottom: 13px
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 5px
        }

        .req {
            color: #c50f1f
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            padding: 8px 12px;
            font: inherit;
            font-size: 16px;
            outline: none
        }

        input:focus {
            border-color: #107c10;
            box-shadow: 0 0 0 3px #107c1022
        }

        .bad {
            border-color: #c50f1f
        }

        .err {
            display: none;
            color: #c50f1f;
            font-size: 12px;
            margin-top: 4px
        }

        .status,
        .msg {
            display: none;
            padding: 9px 11px;
            border-radius: 9px;
            margin-bottom: 12px;
            font-size: 13px
        }

        .ok {
            display: block;
            background: #dcfce7;
            color: #166534
        }

        .fail {
            display: block;
            background: #fee2e2;
            color: #991b1b
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        button {
            height: 48px;
            border: 0;
            border-radius: 9px;
            font: inherit;
            font-weight: 700
        }

        .clear {
            background: #e5ebf1
        }

        .submit {
            background: #107c10;
            color: #fff
        }

        button:disabled {
            opacity: .6
        }
    </style>
</head>

<body>
    <main class="card">
        <div id="status" class="status"></div>
        <form id="form" novalidate>
            <div class="field"><label>Item <span class="req">*</span></label><input id="item" maxlength="11"
                    inputmode="numeric" placeholder="546-2081-12">
                <div id="itemErr" class="err">Item ต้องเป็นรูปแบบ 000-0000-00</div>
            </div>
            <div class="field"><label>จำนวน <span class="req">*</span></label><input id="qty" type="number" min="0.01"
                    step="0.01" inputmode="decimal" placeholder="กรอกจำนวน">
                <div id="qtyErr" class="err">กรุณากรอกจำนวนที่มากกว่า 0</div>
            </div>
            <div class="field"><label>Location <span class="req">*</span></label><input id="loc" maxlength="100"
                    placeholder="กรอกหรือสแกน Location">
                <div id="locErr" class="err">กรุณากรอก Location</div>
            </div>
            <div class="buttons"><button class="clear" type="reset">ล้างข้อมูล</button><button class="submit" id="send"
                    type="submit">ส่งข้อมูล</button></div>
        </form>
        <div id="msg" class="msg"></div>
    </main>
    <script>"use strict";
        const FLOW_URL = "https://default49d8b68c499440779e38e112c21fd0.e3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/d0b605e33b984ea3a29d66e54a893417/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=BITU1_Uw-axN_haRw-M-caNHTYnB_wwS8sUpWDN1QY0";
        const form = document.querySelector("#form"), item = document.querySelector("#item"), qty = document.querySelector("#qty"), loc = document.querySelector("#loc"), statusBox = document.querySelector("#status"), msg = document.querySelector("#msg"), send = document.querySelector("#send");
        const ITEM = /^\d{3}-\d{4}-\d{2}$/; let buffer = "", timer = 0, started = 0, applying = false;
        function clean(v) { return String(v || "").replace(/[\x00-\x1f\x7f]/g, " ").replace(/\s+/g, " ").trim() }
        function extract(v) { const s = clean(v); let m = s.match(/P(\d{3}-\d{4}-\d{2})(?:Q\d+(?:\.\d+)?)?/i); if (m) return m[1]; const found = s.match(/\d{3}-\d{4}-\d{2}/g); if (found) return found[found.length - 1]; m = s.match(/^(\d)(\d{7})(?=,)/); if (m) { const d = m[1] + "4" + m[2]; return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7, 9) } m = s.match(/P(\d{9})(?:Q\d+(?:\.\d+)?)?/i); if (m) { const d = m[1]; return d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7, 9) } return "" }
        function showStatus(t, ok) { statusBox.textContent = t; statusBox.className = "status " + (ok ? "ok" : "fail") }
        function apply(v) { const x = extract(v); if (!x) return false; applying = true; item.value = x; showStatus("สแกนสำเร็จ: Item " + x, true); setTimeout(() => { applying = false; qty.focus(); qty.select() }, 30); return true }
        function finish() { clearTimeout(timer); const v = buffer; buffer = ""; started = 0; if (!v) return false; const ok = apply(v); if (!ok && v.length > 7) showStatus("ไม่พบ Item กรุณาสแกนใหม่", false); return ok }
        document.addEventListener("keydown", e => { if (e.ctrlKey || e.altKey || e.metaKey) return; if (e.key === "Enter" || e.key === "Tab") { if (buffer.length > 7 && finish()) { e.preventDefault(); e.stopImmediatePropagation() } return } if (e.key.length !== 1) return; const now = Date.now(); if (!started || now - started > 700) { buffer = ""; started = now } buffer += e.key; clearTimeout(timer); timer = setTimeout(finish, 220) }, true);
        item.addEventListener("input", () => { if (applying) return; const cur = item.value, x = extract(cur); if (x) { apply(cur); return } if (/[A-Za-z,>.\[\]()]/.test(cur) || cur.length > 11) { buffer += cur; item.value = ""; clearTimeout(timer); timer = setTimeout(finish, 220); return } let d = cur.replace(/\D/g, "").slice(0, 9), f = d.slice(0, 3); if (d.length > 3) f += "-" + d.slice(3, 7); if (d.length > 7) f += "-" + d.slice(7); item.value = f });
        item.addEventListener("paste", e => { const v = e.clipboardData.getData("text"); if (extract(v)) { e.preventDefault(); apply(v) } });
        function setBad(el, err, b) { el.classList.toggle("bad", b); err.style.display = b ? "block" : "none" }
        form.addEventListener("reset", () => setTimeout(() => { statusBox.className = "status"; msg.className = "msg"; document.querySelectorAll(".err").forEach(x => x.style.display = "none"); item.focus() }, 0));
        form.addEventListener("submit", async e => { e.preventDefault(); const q = Number(qty.value), a = !ITEM.test(item.value), b = !Number.isFinite(q) || q <= 0, c = !loc.value.trim(); setBad(item, itemErr, a); setBad(qty, qtyErr, b); setBad(loc, locErr, c); if (a || b || c) return; const data = { Item: item.value, Quantity: q, Location: loc.value.trim(), SubmittedAt: new Date().toISOString() }; send.disabled = true; send.textContent = "กำลังส่ง..."; try { if (FLOW_URL) { const r = await fetch(FLOW_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }); if (!r.ok) throw Error(r.status); msg.textContent = "ส่งข้อมูลเรียบร้อยแล้ว" } else { const rows = JSON.parse(localStorage.getItem("warehouseItemRecords") || "[]"); rows.push(data); localStorage.setItem("warehouseItemRecords", JSON.stringify(rows)); msg.textContent = "บันทึกในเครื่องแล้ว กรุณาใส่ FLOW_URL" } msg.className = "msg ok"; form.reset() } catch (x) { msg.textContent = "ส่งไม่สำเร็จ"; msg.className = "msg fail" } finally { send.disabled = false; send.textContent = "ส่งข้อมูล" } }); window.addEventListener("load", () => item.focus());</script>
</body>

</html>

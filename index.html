<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Warehouse Apps</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4f8;font-family:Segoe UI,Tahoma,Arial;color:#111827;padding:8px}.card{max-width:500px;margin:auto;background:#fff;padding:16px;border-radius:13px;box-shadow:0 8px 24px #0002}.hidden{display:none!important}.field{margin-bottom:13px}label{display:block;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;font:inherit;font-size:16px;background:#fff}input,select{height:48px}textarea{min-height:85px;resize:vertical}.bad{border-color:#c50f1f!important}.err{display:none;color:#b91c1c;font-size:12px;margin-top:4px}.status{display:none;padding:9px 11px;border-radius:9px;margin-bottom:12px;font-size:13px}.ok{display:block;background:#dcfce7;color:#166534}.fail{display:block;background:#fee2e2;color:#991b1b}.checking{display:block;background:#e0f2fe;color:#075985}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{height:46px;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.green{background:#107c10;color:#fff}.red{background:#e30613;color:#fff}.gray{background:#ececec}.wide{width:100%}.bar{display:flex;align-items:center;justify-content:space-between;gap:7px;background:#f1f5f9;padding:9px;border-radius:9px;margin-bottom:13px;font-size:12px}.line{display:flex;gap:4px;white-space:nowrap;overflow:hidden}.line strong{overflow:hidden;text-overflow:ellipsis}.dhl-title{color:#d40511;font-weight:800}.logout{height:34px;padding:0 10px;background:#64748b;color:#fff}.files{list-style:none;padding:0;margin:7px 0 0;font-size:12px}.files li{display:flex;justify-content:space-between;background:#f8fafc;padding:7px 9px;margin-top:5px;border-radius:7px}.remove{height:auto;background:none;color:#b91c1c;padding:0}h2{text-align:center;font-size:20px}
</style></head><body><main class="card">
<section id="login"><h2>ลงชื่อเข้าใช้</h2><div id="loginMsg" class="status"></div><form id="loginForm"><div class="field"><label>เลือก App</label><select id="app"><option value="CK65url">📦 CK65 Warehouse Entry</option><option value="DHLurl">🚚 DHL Material Inspection</option></select></div><div class="field"><label>Username *</label><input id="user"><div id="userErr" class="err">กรุณากรอก Username</div></div><div class="field"><label>Password *</label><input id="pass" type="password"><div id="passErr" class="err">กรุณากรอก Password</div></div><button id="loginBtn" class="green wide">เข้าสู่ระบบ</button></form></section>
<section id="ck" class="hidden"><div class="bar"><div class="line">📦 CK65 | User: <strong id="ckUser"></strong></div><button class="logout" data-out>ออก</button></div><div id="ckMsg" class="status"></div><form id="ckForm"><div class="field"><label>Item *</label><input id="item" placeholder="000-0000-00"><div id="itemErr" class="err">รูปแบบ 000-0000-00</div></div><div class="field"><label>จำนวน *</label><input id="qty" type="number" min="0.01" step="0.01"><div id="qtyErr" class="err">จำนวนต้องมากกว่า 0</div></div><div class="field"><label>Location *</label><input id="loc"><div id="locErr" class="err">กรุณากรอก Location</div></div><div class="buttons"><button class="gray" type="reset">ล้าง</button><button class="green">ตรวจสอบและส่ง</button></div></form></section>
<section id="dhl" class="hidden"><div class="bar"><div class="line"><span class="dhl-title">🚚 ตรวจสอบพัสดุ DHL</span><span>| User:</span><strong id="dhlUser"></strong></div><button class="logout" data-out>ออก</button></div><div id="dhlMsg" class="status"></div><form id="dhlForm"><div class="field"><input id="waybill" placeholder="WAYBILL" aria-label="WAYBILL"><div id="wayErr" class="err">กรุณากรอก WAYBILL</div></div><div class="field"><textarea id="packing" placeholder="Packing Slip (Invoice)" aria-label="Packing Slip (Invoice)"></textarea></div><div class="field"><input id="attach" type="file" multiple accept="image/*,.pdf" aria-label="Attachments"><div id="attachErr" class="err">กรุณาแนบไฟล์</div><ul id="files" class="files"></ul></div><div class="field"><input id="remark" list="remarkList" placeholder="เลือกหรือพิมพ์เพิ่ม" aria-label="Remark"><datalist id="remarkList"><option value="PART"></option><option value="Tools Crib"></option><option value="SURACHET"></option><option value="SAENGJAN"></option><option value="BOWORN"></option><option value="KANYALUCK"></option><option value="SCROLL/ SARINYA"></option><option value="WEERAWUT"></option><option value="SAMIT"></option><option value="CHALERMCHAI"></option><option value="THANPISA"></option><option value="ITTIRIT"></option><option value="WISANU"></option><option value="SAKDA"></option><option value="Jiravat"></option></datalist></div><div class="buttons"><button class="gray" type="reset">ล้าง</button><button class="red">Submit / บันทึก</button></div></form></section>
</main><script>
'use strict';const LOGIN_FLOW_URL='https://default49d8b68c499440779e38e112c21fd0.e3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/12eb496a14694a46be3f7baac94776af/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=5AzPaEhlQITweSyxj7iF8hZ2jn8YYYO6two1_hirDpI';let me=null,flowUrl='',fileBag=[];const $=q=>document.querySelector(q);function msg(e,t,c){e.textContent=t;e.className='status '+c}function invalid(e,id,v){e.classList.toggle('bad',v);$(id).style.display=v?'block':'none'}async function getJson(r){const t=await r.text();if(!t)return{};try{return JSON.parse(t)}catch{throw Error('Flow ตอบกลับไม่ใช่ JSON HTTP '+r.status)}}function show(app,u,url){me=u;flowUrl=url;sessionStorage.setItem('warehouseApp',JSON.stringify({...u,app,url}));$('#login').classList.add('hidden');$('#ck').classList.toggle('hidden',app!=='CK65url');$('#dhl').classList.toggle('hidden',app!=='DHLurl');$('#ckUser').textContent=u.displayName;$('#dhlUser').textContent=u.displayName}function out(){sessionStorage.removeItem('warehouseApp');me=null;flowUrl='';$('#ck').classList.add('hidden');$('#dhl').classList.add('hidden');$('#login').classList.remove('hidden')}document.querySelectorAll('[data-out]').forEach(b=>b.onclick=out);
$('#loginForm').onsubmit=async e=>{e.preventDefault();const employeeId=$('#user').value.trim(),password=$('#pass').value,appName=$('#app').value;invalid($('#user'),'#userErr',!employeeId);invalid($('#pass'),'#passErr',!password);if(!employeeId||!password)return;const b=$('#loginBtn'),c=new AbortController(),tm=setTimeout(()=>c.abort(),30000);b.disabled=true;msg($('#loginMsg'),'กำลังตรวจสอบ...','checking');try{const r=await fetch(LOGIN_FLOW_URL,{method:'POST',mode:'cors',cache:'no-store',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({appName,employeeId,password}),signal:c.signal}),x=await getJson(r);if(!r.ok)throw Error(x.message||'HTTP '+r.status);if(x.valid!==true&&x.authorized!==true)throw Error(x.message||'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');const u=appName==='DHLurl'?(x.dhlFlowUrl||x.flowUrl):(x.ck65FlowUrl||x.flowUrl);if(!u)throw Error('ไม่พบ flowUrl สำหรับ '+appName);show(appName,{username:employeeId,displayName:x.displayName||employeeId,role:x.role||'User'},u)}catch(er){let t=er.name==='AbortError'?'หมดเวลารอ 30 วินาที':er.message;if(['Load failed','Failed to fetch'].includes(t))t='Browser ติดต่อ Login Flow ไม่ได้ โปรดตรวจ URL, CORS หรือเครือข่าย';msg($('#loginMsg'),'เชื่อมต่อระบบลงชื่อเข้าใช้ไม่สำเร็จ: '+t,'fail')}finally{clearTimeout(tm);b.disabled=false}};
$('#ckForm').onsubmit=async e=>{e.preventDefault();const Item=$('#item').value.trim(),Quantity=Number($('#qty').value),Location=$('#loc').value.trim(),a=!/^\d{3}-\d{4}-\d{2}$/.test(Item),q=!Quantity||Quantity<=0,l=!Location;invalid($('#item'),'#itemErr',a);invalid($('#qty'),'#qtyErr',q);invalid($('#loc'),'#locErr',l);if(a||q||l)return;try{msg($('#ckMsg'),'กำลังส่ง...','checking');const r=await fetch(flowUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Item,Quantity,Location,UserName:me.displayName,UserLogin:me.username,SubmittedAt:new Date().toISOString()})}),x=await getJson(r);if(!r.ok||x.valid===false)throw Error(x.message||'HTTP '+r.status);msg($('#ckMsg'),x.message||'บันทึกเรียบร้อย','ok')}catch(er){msg($('#ckMsg'),er.message,'fail')}};
function render(){ $('#files').innerHTML='';fileBag.forEach((f,i)=>{const li=document.createElement('li'),b=document.createElement('button');li.textContent=f.name;b.type='button';b.className='remove';b.textContent='✕';b.onclick=()=>{fileBag.splice(i,1);render()};li.append(b);$('#files').append(li)})}$('#attach').onchange=e=>{for(const f of e.target.files)if(!fileBag.some(x=>x.name===f.name&&x.size===f.size))fileBag.push(f);e.target.value='';render()};function b64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(f)})}$('#dhlForm').onreset=()=>setTimeout(()=>{fileBag=[];render()},0);$('#dhlForm').onsubmit=async e=>{e.preventDefault();const waybill=$('#waybill').value.trim(),bw=!waybill,bf=!fileBag.length;invalid($('#waybill'),'#wayErr',bw);$('#attachErr').style.display=bf?'block':'none';if(bw||bf)return;if(fileBag.some(f=>f.size>8388608)){msg($('#dhlMsg'),'ไฟล์ต้องไม่เกิน 8 MB','fail');return}try{msg($('#dhlMsg'),'กำลังส่ง...','checking');const attachments=await Promise.all(fileBag.map(async f=>({fileName:f.name,contentType:f.type||'application/octet-stream',contentBytes:await b64(f)})));const body={action:'CreateDHLInspection',waybill,packingSlip:$('#packing').value.trim(),remark:$('#remark').value.trim(),verifiedBy:me.displayName,verifiedByLogin:me.username,verifiedDate:new Date().toISOString(),attachments};const r=await fetch(flowUrl,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)}),x=await getJson(r);if(!r.ok||x.success===false)throw Error(x.message||'HTTP '+r.status);msg($('#dhlMsg'),x.message||'บันทึกเรียบร้อย','ok')}catch(er){msg($('#dhlMsg'),'บันทึกไม่สำเร็จ: '+er.message,'fail')}};window.onload=()=>{let x;try{x=JSON.parse(sessionStorage.getItem('warehouseApp'))}catch{}if(x)show(x.app,x,x.url)};
</script></body></html>

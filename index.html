<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#edf4f8">
<title>Warehouse Apps | CK65 & DHL</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%}body{background:#edf4f8;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#111827;padding:7px}.card{width:100%;max-width:500px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 10px 28px rgba(15,23,42,.13);padding:16px}.hidden{display:none!important}.field{margin-bottom:13px}label{display:block;margin-bottom:5px;font-weight:700}.req{color:#c50f1f}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:9px 12px;font:inherit;font-size:16px;outline:none;background:#fff}input,select{height:48px}textarea{min-height:85px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#107c10;box-shadow:0 0 0 3px rgba(16,124,16,.13)}.bad{border-color:#c50f1f!important;background:#fff7f7}.err{display:none;margin-top:4px;color:#c50f1f;font-size:12px}.status,.msg{display:none;padding:9px 11px;border-radius:9px;margin-bottom:12px;font-size:13px}.ok{display:block;background:#dcfce7;color:#166534}.fail{display:block;background:#fee2e2;color:#991b1b}.checking{display:block;background:#e0f2fe;color:#075985}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{height:46px;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#107c10;color:#fff}.dhl-primary{background:#d40511;color:#fff}.clear{background:#ececec;color:#111827}.login-btn{width:100%;background:#107c10;color:#fff}.userbar{display:flex;align-items:center;justify-content:space-between;gap:7px;background:#f1f5f9;padding:9px;border-radius:9px;margin-bottom:13px;font-size:12px}.userline{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden}.userline strong{overflow:hidden;text-overflow:ellipsis}.dhl-title{color:#d40511;font-weight:800}.divider{color:#94a3b8}.logout{height:34px;background:#64748b;color:#fff;padding:0 10px}.login-title{text-align:center;font-size:20px;font-weight:800;margin:2px 0 16px}.file-list{list-style:none;margin:7px 0 0;padding:0;font-size:12px}.file-list li{display:flex;justify-content:space-between;gap:8px;background:#f8fafc;padding:7px 9px;border-radius:7px;margin-top:5px}.remove-file{height:auto;padding:0;background:transparent;color:#b91c1c}.placeholder-file{height:auto;padding:12px}.spinner{display:inline-block;width:13px;height:13px;margin-right:6px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}button:disabled{opacity:.6;cursor:wait}@media(max-width:440px){.userbar{font-size:11px}.userline{gap:3px}.logout{padding:0 8px}.buttons{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="card">
<section id="loginPanel">
  <div class="login-title">ลงชื่อเข้าใช้</div>
  <div id="loginStatus" class="status" role="status"></div>
  <form id="loginForm" novalidate>
    <div class="field"><label for="appSelect">เลือก App</label><select id="appSelect"><option value="CK65url">📦 CK65 Warehouse Entry</option><option value="DHLurl">🚚 DHL Material Inspection</option></select></div>
    <div class="field"><label for="username">Username <span class="req">*</span></label><input id="username" autocomplete="username" autocapitalize="none"><div id="usernameErr" class="err">กรุณากรอก Username</div></div>
    <div class="field"><label for="password">Password <span class="req">*</span></label><input id="password" type="password" autocomplete="current-password"><div id="passwordErr" class="err">กรุณากรอก Password</div></div>
    <button id="loginButton" class="login-btn" type="submit">เข้าสู่ระบบ</button>
  </form>
</section>

<section id="ckPanel" class="hidden">
  <div class="userbar"><div class="userline"><span>📦 CK65 Warehouse Entry</span><span class="divider">|</span><span>User:</span><strong id="ckUser"></strong></div><button class="logout" data-logout type="button">ออก</button></div>
  <div id="ckStatus" class="status" role="status"></div>
  <form id="ckForm" novalidate>
    <div class="field"><label for="item">Item <span class="req">*</span></label><input id="item" autocomplete="off" placeholder="000-0000-00"><div id="itemErr" class="err">Item ต้องเป็นรูปแบบ 000-0000-00</div></div>
    <div class="field"><label for="quantity">จำนวน <span class="req">*</span></label><input id="quantity" type="number" min="0.01" step="0.01" inputmode="decimal"><div id="quantityErr" class="err">จำนวนต้องมากกว่า 0</div></div>
    <div class="field"><label for="location">Location <span class="req">*</span></label><input id="location" autocomplete="off"><div id="locationErr" class="err">กรุณากรอก Location</div></div>
    <div class="buttons"><button class="clear" type="reset">ล้าง</button><button id="ckSend" class="primary" type="submit">ตรวจสอบและส่ง</button></div>
  </form>
</section>

<section id="dhlPanel" class="hidden">
  <div class="userbar"><div class="userline"><span class="dhl-title">🚚 ตรวจสอบพัสดุ DHL</span><span class="divider">|</span><span>User:</span><strong id="dhlUser"></strong></div><button class="logout" data-logout type="button">ออก</button></div>
  <div id="dhlStatus" class="status" role="status"></div>
  <form id="dhlForm" novalidate>
    <div class="field"><input id="waybill" autocomplete="off" inputmode="numeric" placeholder="WAYBILL" aria-label="WAYBILL"><div id="waybillErr" class="err">กรุณากรอก WAYBILL</div></div>
    <div class="field"><textarea id="packingSlip" placeholder="Packing Slip (Invoice)" aria-label="Packing Slip (Invoice)"></textarea></div>
    <div class="field"><input id="attachments" class="placeholder-file" type="file" multiple accept="image/*,.pdf" aria-label="Attachments"><div id="attachmentsErr" class="err">กรุณาแนบไฟล์อย่างน้อย 1 ไฟล์</div><ul id="fileList" class="file-list"></ul></div>
    <div class="field"><label for="remark">Remark</label><input id="remark" list="remarks" autocomplete="off" placeholder="เลือกหรือพิมพ์เพิ่ม"><datalist id="remarks"><option value="PART"></option><option value="Tools Crib"></option><option value="SURACHET"></option><option value="SAENGJAN"></option><option value="BOWORN"></option><option value="KANYALUCK"></option><option value="SCROLL/ SARINYA"></option><option value="WEERAWUT"></option><option value="SAMIT"></option><option value="CHALERMCHAI"></option><option value="THANPISA"></option><option value="ITTIRIT"></option><option value="WISANU"></option><option value="SAKDA"></option><option value="Jiravat"></option></datalist></div>
    <div class="buttons"><button class="clear" type="reset">ล้าง</button><button id="dhlSend" class="dhl-primary" type="submit">Submit / บันทึก</button></div>
  </form>
</section>
</main>
<script>
"use strict";
const LOGIN_FLOW_URL='https://default49d8b68c499440779e38e112c21fd0.e3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/10/workflows/12eb496a14694a46be3f7baac94776af/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=5AzPaEhlQITweSyxj7iF8hZ2jn8YYYO6two1_hirDpI';
let currentUser=null,appFlowUrl="",selectedFiles=[];
const $=s=>document.querySelector(s);
function setStatus(el,text,type){el.textContent=text;el.className="status "+type}
function clearStatus(el){el.textContent="";el.className="status"}
function setInvalid(el,errorId,isBad){el.classList.toggle("bad",isBad);$(errorId).style.display=isBad?"block":"none"}
async function readJson(response){const text=await response.text();if(!text)return{};try{return JSON.parse(text)}catch{throw new Error("Flow ตอบกลับไม่ใช่ JSON (HTTP "+response.status+")")}}
function openApp(appName,user,flowUrl){currentUser=user;appFlowUrl=flowUrl;sessionStorage.setItem("warehouseAppUser",JSON.stringify({...user,appName,flowUrl}));$("#loginPanel").classList.add("hidden");$("#ckPanel").classList.toggle("hidden",appName!=="CK65url");$("#dhlPanel").classList.toggle("hidden",appName!=="DHLurl");$("#ckUser").textContent=user.displayName;$("#dhlUser").textContent=user.displayName;setTimeout(()=>appName==="DHLurl"?$("#waybill").focus():$("#item").focus(),50)}
function logout(){sessionStorage.removeItem("warehouseAppUser");currentUser=null;appFlowUrl="";$("#ckPanel").classList.add("hidden");$("#dhlPanel").classList.add("hidden");$("#loginPanel").classList.remove("hidden");$("#password").value="";$("#username").focus()}
document.querySelectorAll("[data-logout]").forEach(b=>b.addEventListener("click",logout));
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const employeeId=$("#username").value.trim(),password=$("#password").value,appName=$("#appSelect").value;setInvalid($("#username"),"#usernameErr",!employeeId);setInvalid($("#password"),"#passwordErr",!password);if(!employeeId||!password)return;const button=$("#loginButton"),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);button.disabled=true;button.innerHTML='<span class="spinner"></span>กำลังตรวจสอบ';setStatus($("#loginStatus"),"กำลังตรวจสอบ "+appName+"...","checking");try{const response=await fetch(LOGIN_FLOW_URL,{method:"POST",mode:"cors",cache:"no-store",redirect:"follow",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({appName,employeeId,password}),signal:controller.signal});const result=await readJson(response);if(!response.ok)throw new Error(result.message||"HTTP "+response.status);if(result.valid!==true&&result.authorized!==true)throw new Error(result.message||"ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");const flowUrl=appName==="DHLurl"?(result.dhlFlowUrl||result.flowUrl):(result.ck65FlowUrl||result.flowUrl);if(!flowUrl)throw new Error("Login Flow ไม่ได้ส่ง URL สำหรับ "+appName);openApp(appName,{username:employeeId,displayName:result.displayName||employeeId,role:result.role||"User"},flowUrl)}catch(err){let message=err.name==="AbortError"?"หมดเวลารอ Login Flow หลังจาก 30 วินาที":err.message;if(["Load failed","Failed to fetch","NetworkError when attempting to fetch resource."].includes(message))message="Browser ติดต่อ Login Flow ไม่ได้ กรุณาตรวจ URL, Run history, CORS หรือเครือข่าย";setStatus($("#loginStatus"),"เชื่อมต่อระบบลงชื่อเข้าใช้ไม่สำเร็จ: "+message,"fail")}finally{clearTimeout(timer);button.disabled=false;button.textContent="เข้าสู่ระบบ"}});
$("#ckForm").addEventListener("submit",async e=>{e.preventDefault();const Item=$("#item").value.trim(),Quantity=Number($("#quantity").value),Location=$("#location").value.trim();const badItem=!/^\d{3}-\d{4}-\d{2}$/.test(Item),badQty=!Number.isFinite(Quantity)||Quantity<=0,badLoc=!Location;setInvalid($("#item"),"#itemErr",badItem);setInvalid($("#quantity"),"#quantityErr",badQty);setInvalid($("#location"),"#locationErr",badLoc);if(badItem||badQty||badLoc)return;const button=$("#ckSend");button.disabled=true;setStatus($("#ckStatus"),"กำลังส่งข้อมูล...","checking");try{const response=await fetch(appFlowUrl,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({Item,Quantity,Location,UserName:currentUser.displayName,UserLogin:currentUser.username,SubmittedAt:new Date().toISOString()})});const result=await readJson(response);if(!response.ok||result.valid===false)throw new Error(result.message||"HTTP "+response.status);setStatus($("#ckStatus"),result.message||"บันทึกเรียบร้อยแล้ว","ok")}catch(err){setStatus($("#ckStatus"),"บันทึกไม่สำเร็จ: "+err.message,"fail")}finally{button.disabled=false}});
function renderFiles(){const list=$("#fileList");list.innerHTML="";selectedFiles.forEach((file,index)=>{const li=document.createElement("li"),name=document.createElement("span"),remove=document.createElement("button");name.textContent=file.name+" ("+(file.size/1048576).toFixed(2)+" MB)";remove.type="button";remove.className="remove-file";remove.textContent="✕";remove.onclick=()=>{selectedFiles.splice(index,1);renderFiles()};li.append(name,remove);list.append(li)})}
$("#attachments").addEventListener("change",e=>{for(const file of e.target.files){if(!selectedFiles.some(x=>x.name===file.name&&x.size===file.size))selectedFiles.push(file)}e.target.value="";renderFiles()});
function toBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");reader.onerror=reject;reader.readAsDataURL(file)})}
$("#dhlForm").addEventListener("reset",()=>setTimeout(()=>{selectedFiles=[];renderFiles();clearStatus($("#dhlStatus"));$("#waybill").focus()},0));
$("#dhlForm").addEventListener("submit",async e=>{e.preventDefault();const waybill=$("#waybill").value.trim(),badWaybill=!waybill,badFiles=!selectedFiles.length;setInvalid($("#waybill"),"#waybillErr",badWaybill);$("#attachmentsErr").style.display=badFiles?"block":"none";if(badWaybill||badFiles)return;if(selectedFiles.some(file=>file.size>8*1024*1024)){setStatus($("#dhlStatus"),"ไฟล์แต่ละไฟล์ต้องไม่เกิน 8 MB","fail");return}const button=$("#dhlSend");button.disabled=true;button.innerHTML='<span class="spinner"></span>กำลังส่ง';setStatus($("#dhlStatus"),"กำลังส่งข้อมูล...","checking");try{const attachments=await Promise.all(selectedFiles.map(async file=>({fileName:file.name,contentType:file.type||"application/octet-stream",contentBytes:await toBase64(file)})));const payload={action:"CreateDHLInspection",waybill,packingSlip:$("#packingSlip").value.trim(),remark:$("#remark").value.trim(),verifiedBy:currentUser.displayName,verifiedByLogin:currentUser.username,verifiedDate:new Date().toISOString(),attachments};const response=await fetch(appFlowUrl,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload)});const result=await readJson(response);if(!response.ok||result.success===false)throw new Error(result.message||"HTTP "+response.status);setStatus($("#dhlStatus"),result.message||"บันทึกข้อมูล DHL เรียบร้อยแล้ว","ok");$("#dhlForm").reset()}catch(err){setStatus($("#dhlStatus"),"บันทึกไม่สำเร็จ: "+err.message,"fail")}finally{button.disabled=false;button.textContent="Submit / บันทึก"}});
window.addEventListener("load",()=>{let saved=null;try{saved=JSON.parse(sessionStorage.getItem("warehouseAppUser")||"null")}catch{}if(saved&&saved.username)openApp(saved.appName,saved,saved.flowUrl);else $("#username").focus()});
</script>
</body></html>

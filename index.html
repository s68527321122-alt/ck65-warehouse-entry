<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f1f5f9">
  <title>บันทึกรายการสินค้า</title>
  <style>
    :root {
      --primary: #107c10;
      --primary-dark: #0b5f0b;
      --danger: #c50f1f;
      --bg: #edf4f8;
      --card: #fff;
      --text: #111827;
      --muted: #64748b;
      --border: #cbd5e1
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      padding: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: var(--bg);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      overflow-x: hidden
    }

    .app {
      width: 100%;
      max-width: 480px
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, .13);
      overflow: hidden
    }

    form {
      padding: 18px
    }

    .field {
      margin-bottom: 14px
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 1rem;
      font-weight: 700
    }

    .required {
      color: var(--danger)
    }

    input {
      width: 100%;
      height: 48px;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      outline: none
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 124, 16, .13)
    }

    input.invalid {
      border-color: var(--danger)
    }

    .help {
      margin-top: 7px;
      color: var(--muted);
      font-size: .82rem
    }

    .error {
      display: none;
      margin-top: 7px;
      color: var(--danger);
      font-size: .84rem
    }

    .status {
      display: none;
      margin-bottom: 12px;
      padding: 9px 11px;
      border-radius: 10px;
      font-size: .92rem
    }

    .status.ok {
      display: block;
      color: #166534;
      background: #dcfce7
    }

    .status.bad {
      display: block;
      color: #991b1b;
      background: #fee2e2
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    button {
      height: 48px;
      min-height: 48px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer
    }

    .clear {
      background: #e5ebf1;
      color: #111827
    }

    .submit {
      background: var(--primary);
      color: #fff
    }

    .submit:hover {
      background: var(--primary-dark)
    }

    button:disabled {
      opacity: .6;
      cursor: wait
    }

    .message {
      display: none;
      margin: 0 18px 18px;
      padding: 10px 12px;
      border-radius: 10px
    }

    .message.success {
      display: block;
      color: #166534;
      background: #dcfce7
    }

    .message.fail {
      display: block;
      color: #991b1b;
      background: #fee2e2
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: .78rem;
      padding: 12px
    }

    @media(max-width:480px) {
      body {
        padding: 6px;
        align-items: flex-start
      }

      .card {
        border-radius: 12px
      }

      form {
        padding: 16px
      }

      .field {
        margin-bottom: 13px
      }

      .buttons {
        grid-template-columns: 1fr 1fr;
        gap: 8px
      }

      .message {
        margin: 0 16px 16px
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="card">
      <form id="itemForm" novalidate>
        <div id="scanStatus" class="status" role="status" aria-live="polite"></div>
        <div class="field">
          <label for="item">Item <span class="required">*</span></label>
          <input id="item" name="Item" type="text" maxlength="11" inputmode="numeric" autocomplete="off"
            placeholder="546-2081-12" pattern="[0-9]{3}-[0-9]{4}-[0-9]{2}" required>
          <div id="itemError" class="error">Item ต้องเป็นรูปแบบ 000-0000-00</div>
        </div>
        <div class="field">
          <label for="quantity">จำนวน <span class="required">*</span></label>
          <input id="quantity" name="Quantity" type="number" min="0.01" step="0.01" inputmode="decimal"
            autocomplete="off" placeholder="กรอกจำนวน" required>
          <div id="quantityError" class="error">กรุณากรอกจำนวนที่มากกว่า 0</div>
        </div>
        <div class="field">
          <label for="location">Location <span class="required">*</span></label>
          <input id="location" name="Location" type="text" maxlength="100" autocomplete="off"
            placeholder="กรอกหรือสแกน Location" required>
          <div id="locationError" class="error">กรุณากรอก Location</div>
        </div>
        <div class="buttons"><button type="reset" class="clear">ล้างข้อมูล</button><button type="submit" id="submitBtn"
            class="submit">ส่งข้อมูล</button></div>
      </form>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    "use strict";
    // วาง URL จาก Power Automate: When an HTTP request is received
    const FLOW_URL = "https://default49d8b68c499440779e38e112c21fd0.e3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/d0b605e33b984ea3a29d66e54a893417/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=BITU1_Uw-axN_haRw-M-caNHTYnB_wwS8sUpWDN1QY0";
    const form = document.getElementById("itemForm"), itemInput = document.getElementById("item"), quantityInput = document.getElementById("quantity"), locationInput = document.getElementById("location"), submitBtn = document.getElementById("submitBtn"), message = document.getElementById("message"), scanStatus = document.getElementById("scanStatus");
    const ITEM_PATTERN = /^\d{3}-\d{4}-\d{2}$/;
    let scanBuffer = "", scanTimer = null, scanStart = 0, isApplying = false;
    function invalid(inputId, errorId, value) { document.getElementById(inputId).classList.toggle("invalid", value); document.getElementById(errorId).style.display = value ? "block" : "none" }
    function status(text, type) { scanStatus.textContent = text; scanStatus.className = "status " + type }
    function clean(value) { return String(value || "").replace(/[\x00-\x1F\x7F]/g, " ").replace(/\s+/g, " ").trim() }
    function extract(value) {
      const s = clean(value);
      // แบบ P/Q เดิม ดึงเฉพาะ Item ไม่ดึงจำนวนหลัง Q
      let m = s.match(/P(\d{3}-\d{4}-\d{2})(?:Q\d+(?:\.\d+)?)?/i);
      if (m) return { item: m[1] };
      // Item ปรากฏที่ใดก็ได้ เช่น ข้อมูลยาวตามด้วย 546-2081-12
      const items = s.match(/\d{3}-\d{4}-\d{2}/g);
      if (items && items.length) return { item: items[items.length - 1] };
      // แบบ P + ตัวเลข 9 หลัก ไม่มีขีด
      m = s.match(/P(\d{9})(?:Q\d+(?:\.\d+)?)?/i);
      if (m) { const d = m[1]; return { item: d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7, 9) } }
      return null;
    }
    function applyScan(value) {
      const result = extract(value); if (!result) return false;
      isApplying = true; itemInput.value = result.item;
      // ไม่ใส่จำนวนจาก Barcode ผู้ใช้กรอกจำนวนเอง
      invalid("item", "itemError", false); status("สแกนสำเร็จ: Item " + result.item, "ok");
      setTimeout(() => { isApplying = false; quantityInput.focus(); quantityInput.select() }, 40); return true;
    }
    function finishScan() { clearTimeout(scanTimer); const value = scanBuffer; scanBuffer = ""; scanStart = 0; if (!value) return false; const ok = applyScan(value); if (!ok && value.length >= 8) { status("ไม่พบ Item รูปแบบ 000-0000-00 กรุณาสแกนใหม่", "bad"); itemInput.focus() } return ok }
    // รองรับ CK65 Keyboard Wedge ทั้ง Enter/Tab และกรณีไม่มี Suffix
    document.addEventListener("keydown", function (e) {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (e.key === "Enter" || e.key === "Tab") {
        if (scanBuffer.length >= 8 && finishScan()) { e.preventDefault(); e.stopImmediatePropagation() } return;
      }
      if (e.key.length !== 1) return;
      const now = Date.now(); if (!scanStart || now - scanStart > 700) { scanBuffer = ""; scanStart = now }
      scanBuffer += e.key; clearTimeout(scanTimer); scanTimer = setTimeout(finishScan, 220);
    }, true);
    // รองรับ Standard/InputMethod หรือการสแกนลงช่อง Item
    itemInput.addEventListener("input", function () {
      if (isApplying) return;
      const current = itemInput.value;
      const result = extract(current); if (result) { applyScan(current); return }
      if (/[A-Za-z,>.\[\]()]/.test(current) || current.length > 11) { scanBuffer += current; itemInput.value = ""; clearTimeout(scanTimer); scanTimer = setTimeout(finishScan, 220); return }
      let d = current.replace(/\D/g, "").slice(0, 9), f = d.slice(0, 3); if (d.length > 3) f += "-" + d.slice(3, 7); if (d.length > 7) f += "-" + d.slice(7, 9); itemInput.value = f; invalid("item", "itemError", f.length > 0 && !ITEM_PATTERN.test(f));
    });
    itemInput.addEventListener("paste", function (e) { const v = e.clipboardData.getData("text"); if (extract(v)) { e.preventDefault(); applyScan(v) } });
    function validate() { const item = itemInput.value.trim(), qty = Number(quantityInput.value), loc = locationInput.value.trim(); const a = !ITEM_PATTERN.test(item), b = !Number.isFinite(qty) || qty <= 0, c = !loc; invalid("item", "itemError", a); invalid("quantity", "quantityError", b); invalid("location", "locationError", c); return !a && !b && !c }
    function saveLocal(data) { const key = "warehouseItemRecords", rows = JSON.parse(localStorage.getItem(key) || "[]"); rows.push(data); localStorage.setItem(key, JSON.stringify(rows)) }
    function show(text, type) { message.textContent = text; message.className = "message " + type }
    form.addEventListener("reset", () => setTimeout(() => { document.querySelectorAll("input").forEach(x => x.classList.remove("invalid")); document.querySelectorAll(".error").forEach(x => x.style.display = "none"); scanBuffer = ""; clearTimeout(scanTimer); scanStatus.className = "status"; message.className = "message"; itemInput.focus() }, 0));
    form.addEventListener("submit", async function (e) {
      e.preventDefault(); if (!validate()) return;
      const data = { Item: itemInput.value.trim(), Quantity: Number(quantityInput.value), Location: locationInput.value.trim(), SubmittedAt: new Date().toISOString() };
      submitBtn.disabled = true; submitBtn.textContent = "กำลังส่ง...";
      try {
        if (FLOW_URL) { const r = await fetch(FLOW_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) }); if (!r.ok) throw new Error("HTTP " + r.status); show("ส่งข้อมูลเข้า Microsoft Lists เรียบร้อยแล้ว", "success") }
        else { saveLocal(data); show("บันทึกในเครื่องแล้ว กรุณาใส่ FLOW_URL เพื่อส่งเข้า Microsoft Lists", "success") }
        form.reset();
      } catch (err) { saveLocal(data); show("ส่งออนไลน์ไม่สำเร็จ แต่บันทึกสำรองในเครื่องแล้ว", "fail"); console.error(err) } finally { submitBtn.disabled = false; submitBtn.textContent = "ส่งข้อมูล" }
    });
    window.addEventListener("load", () => itemInput.focus());
  </script>
</body>

</html>
